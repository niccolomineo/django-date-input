[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-temporal-inputs"
version = "1.0.0"
description = "Native HTML5 date, datetime and time input widgets for Django, with optional bounds."
readme = "README.md"
keywords = [ "date", "datetime", "django", "forms", "html5", "time", "widget" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Niccolò Mineo", email = "niccolo@20tab.com" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = [
  "django>=5.2",
]
urls.Changelog = "https://github.com/niccolomineo/django-temporal-inputs/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/niccolomineo/django-temporal-inputs#readme"
urls.Homepage = "https://github.com/niccolomineo/django-temporal-inputs"
urls.Issues = "https://github.com/niccolomineo/django-temporal-inputs/issues"

[dependency-groups]
dev = [
  "gha-update~=0.2",
  "prek~=0.4",
  { include-group = "test" },
]
test = [
  "coverage[toml]>=7",
  "tblib>=3",
]

[tool.hatch]
build.targets.wheel.packages = [ "temporal_inputs" ]

[tool.ruff]
target-version = "py312"
line-length = 100
format.docstring-code-format = true
lint.select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "C90", # McCabe cyclomatic complexity
  "D",   # pydocstyle
  "DJ",  # flake8-django
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "I",   # isort
  "Q",   # flake8-quotes
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [
  "D203",
  "D212",
  "DJ007",
]
lint.per-file-ignores."manage.py" = [ "E402" ]
lint.isort.known-first-party = [ "temporal_inputs" ]
lint.isort.known-third-party = [ "django" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.bandit]
exclude_dirs = [ ".venv", "tests" ]

[tool.coverage]
run.source = [ "temporal_inputs" ]
run.omit = [
  "manage.py",
]
run.branch = true
run.concurrency = [ "multiprocessing" ]
run.parallel = true
report.fail_under = 100
report.skip_covered = true
report.show_missing = true
